<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc"><title id="title">Yap architecture: evidence, verification, creator approval, and rendering</title><desc id="desc">Public sources enter a Deep Agents coordinator that delegates specialists in dependency order: source researcher, then network analyst, then creative strategist. Five run-local virtual files feed a graph with observed links and derived similarities. The creator reviews selected research as attributed framing, separately supplies their own facts and photos, and reviews a script and scene proposal. Structural checks validate timing, durations, provenance, source versions, scene coverage, and photo references; they do not certify factual truth. Only explicit creator approval of the current content version authorizes Sharp and FFmpeg rendering into a silent vertical MP4 and caption for manual posting. Content edits invalidate downstream artifacts and approvals.</desc><g font-family="Manrope, DejaVu Sans, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#62695b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c9402b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1800" height="1500" rx="0" fill="#f7f7f5"/><text x="80" y="98" font-size="62" font-weight="700" fill="#232421" >yap</text><text x="193" y="98" font-size="62" font-weight="700" fill="#c9402b" >.</text><text x="275" y="96" font-size="48" font-weight="600" fill="#232421" >From evidence to a reviewed reel.</text><text x="80" y="151" font-size="24" font-weight="400" fill="#62695b" >Public research informs the framing. Creator facts and approval stay with the creator.</text><path d="M 360 286 H 403" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 620 344 V 375 H 240 V 412" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 400 474 H 434" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 760 474 H 794" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 240 530 V 568" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 530 V 568" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 960 530 V 568" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1120 660 H 1234" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1480 744 V 808" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 310 944 V 988" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1480 944 V 988 H 310" fill="none" stroke="#c9402b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="988" r="5" fill="#c9402b"/><path d="M 310 988 V 1034" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 540 1112 H 614" fill="none" stroke="#62695b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><pat