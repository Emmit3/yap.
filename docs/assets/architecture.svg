21" >Accept this exact content version</text><text x="1190" y="1161" font-size="23" font-weight="400" fill="#62695b" >Structural checks do not approve for you.</text><text x="1010" y="1224" font-size="20" font-weight="500" fill="#c9402b" >Only current, approved material</text><rect x="80" y="1280" width="460" height="126" rx="16" fill="#232421"/><text x="110" y="1325" font-size="28" font-weight="600" fill="#ffffff" >Content changed?</text><text x="110" y="1364" font-size="21" font-weight="400" fill="#e0e4dc" >Reset downstream artifacts + approvals.</text><rect x="620" y="1280" width="460" height="126" rx="16" fill="#ffffff" stroke="#dadfd5" stroke-width="1.5"/><text x="650" y="1325" font-size="30" font-weight="600" fill="#232421" >Sharp + FFmpeg</text><text x="650" y="1364" font-size="23" font-weight="400" fill="#62695b" >Supplied photos + pinned scenes</text><rect x="1160" y="1280" width="560" height="126" rx="16" fill="#ffffff" stroke="#dadfd5" stroke-width="1.5"/><text x="1190" y="1325" font-size="30" font-weight="600" fill="#232421" >Vertical MP4 + caption</text><text x="1190" y="1364" font-size="23" font-weight="400" fill="#62695b" >1080 × 1920 · silent · manual posting</text><text x="80" y="1463" font-size="21" font-weight="400" fill="#62695b" >Structural checks validate consistency. Creator review determines which claims and visuals to use.</text></g></svg>