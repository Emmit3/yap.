<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Media credits — yap.</title><link rel="stylesheet" href="./styles.css"></head><body class="credits-page"><a class="wordmark" href="./">yap<span>.</span></a><h1>Behind the frames.</h1><p>Photography and footage used in this illustrative product concept.</p><div id="credits-list"></div><p>Motion and composition references: <a href="https://motionin.design/gallery/burst">Burst</a>, <a href="https://motionin.design/gallery/frieze">Frieze</a>, and <a href="https://motionin.design/gallery/crema">Crema</a> by Motion.</p><a href="./">Back to the playground ↗</a><script type="module">const response=await fetch('./media/credits.json'); const data=await response.json(); const list=document.querySelector('#credits-list'); function add(item){if(!item||typeof item!=='object')return; const source=item.sourceUrl||item.source||item.url||item.downloadUrl||item.sourcePage; if(typeof source==='string'&&/^https?:/.test(source)){const p=document.createElement('p');const a=document.createElement('a');a.href=source;a.textContent=item.title||item.subject||item.filename||item.file||'Source';a.rel='noreferrer';p.append(a);list.append(p);} else Object.values(item).forEach(v=>Array.isArray(v)?v.forEach(add):typeof v==='object'&&add(v));}add(data);</script></body></html>
